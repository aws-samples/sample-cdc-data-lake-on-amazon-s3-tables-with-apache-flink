# Tier-A local stack: self-managed MySQL -> Flink CDC -> Apache Iceberg.
#
# MinIO stands in for Amazon S3 and the Apache iceberg-rest-fixture stands in for
# the S3 Tables Iceberg REST endpoint, so the SAME Flink SQL job that runs here
# runs unchanged against real S3 Tables (only the catalog `uri`/`warehouse` and
# credentials change). One user-defined network for predictable DNS.
name: zero-etl-cdc

services:
  # ---- Self-managed source database (binlog enabled for CDC) ----------------
  mysql:
    image: mysql:8.4.11
    container_name: cdc-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: inventory
      MYSQL_USER: cdc
      MYSQL_PASSWORD: cdcpw
    # binlog in ROW mode is what Flink CDC reads. GTID on for safe recovery.
    command:
      - --server-id=223344
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
    ports: ["3306:3306"]
    volumes:
      - ./sql/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-prootpw"]
      interval: 5s
      timeout: 5s
      retries: 30

  # ---- Alternative source engines (opt-in via `--profile`) ------------------
  # The narrative uses MySQL; these carry the PostgreSQL and Oracle variants.
  #   docker compose --profile postgres up -d
  #   docker compose --profile oracle   up -d
  # Then submit sql/cdc_to_iceberg_postgres.sql or _oracle.sql instead.
  postgres:
    image: postgres:16
    container_name: cdc-postgres
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: cdc
      POSTGRES_PASSWORD: cdcpw
    # wal_level=logical is what Flink CDC (postgres-cdc) reads via a slot.
    command: ["-c", "wal_level=logical", "-c", "max_wal_senders=10", "-c", "max_replication_slots=10"]
    ports: ["5432:5432"]
    volumes:
      - ./sql/seed_postgres.sql:/docker-entrypoint-initdb.d/seed.sql:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cdc -d inventory"]
      interval: 5s
      timeout: 5s
      retries: 30

  oracle:
    # Pinned to a real 23ai build. The floating `23-slim` tag was repointed to
    # the rebranded "Oracle AI Database 26ai" whose v$version banner no longer
    # starts with "Oracle Database", which breaks Debezium's version detection
    # (resolveOracleDatabaseVersion finds no rows -> job restart loop).
    image: gvenzl/oracle-free:23.9-slim
    container_name: cdc-oracle
    profiles: ["oracle"]
    restart: unless-stopped
    environment:
      ORACLE_PASSWORD: cdcpw
      APP_USER: cdc
      APP_USER_PASSWORD: cdcpw
    ports: ["1521:1521"]
    volumes:
      - ./sql/oracle-setup.sql:/container-entrypoint-initdb.d/01-setup.sql:ro
      - ./sql/seed_oracle.sql:/container-entrypoint-initdb.d/02-seed.sql:ro
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 60

  # ---- Object store (S3 stand-in) -------------------------------------------
  minio:
    # Pinned to a release whose arm64 manifest entry actually contains arm64
    # binaries; the 2025-09-07 tag's arm64 entry ships amd64 binaries and
    # exec-format-errors on Apple Silicon without Rosetta emulation.
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: cdc-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 30

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: cdc-minio-init
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/warehouse &&
      echo 'bucket warehouse ready'"
    restart: "no"

  # ---- Iceberg REST catalog (stands in for the S3 Tables REST endpoint) ------
  iceberg-rest:
    image: apache/iceberg-rest-fixture:1.10.1
    container_name: cdc-iceberg-rest
    restart: unless-stopped
    depends_on:
      minio-init: {condition: service_completed_successfully}
    environment:
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
    ports: ["8181:8181"]

  # ---- Flink 2.3 (session mode; jars baked into the image) -------------------
  jobmanager:
    build: {context: ., dockerfile: docker/Dockerfile.flink}
    image: zero-etl-flink:2.3
    container_name: cdc-jobmanager
    command: jobmanager
    depends_on:
      iceberg-rest: {condition: service_started}
    ports: ["8081:8081"]
    volumes:
      - ./sql:/opt/sql:ro
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        rest.address: 0.0.0.0
        rest.bind-address: 0.0.0.0
        execution.checkpointing.interval: 10s
        state.backend.type: rocksdb
        taskmanager.numberOfTaskSlots: 2
        parallelism.default: 1

  taskmanager:
    image: zero-etl-flink:2.3
    container_name: cdc-taskmanager
    command: taskmanager
    depends_on:
      jobmanager: {condition: service_started}
    scale: 1
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2
        taskmanager.memory.process.size: 2560m
        state.backend.type: rocksdb
        parallelism.default: 1

volumes:
  mysql-data:
  postgres-data:
  oracle-data:
  minio-data:
