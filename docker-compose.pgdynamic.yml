# PostgreSQL dynamic-mode harness: whole-schema CDC -> Iceberg REST fixture
# -> MinIO, mirroring docker-compose.dynamic.yml (the MySQL twin). Includes a
# heartbeat sidecar updating public.cdc_heartbeat every 10s from the DB side,
# which keeps the replication slot advancing while business tables are idle
# (see README: PostgreSQL replication-slot retention). The job drops those
# records before the sink (cdc.heartbeat-table).
name: zero-etl-cdc-pgdynamic

services:
  postgres:
    image: postgres:16
    container_name: cdcpgdyn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgrespw
      POSTGRES_DB: inventory
    command:
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=8
      - -c
      - max_wal_senders=8
    ports: ["5438:5432"]
    volumes:
      - ./docker/seed_pg_dynamic.sql:/docker-entrypoint-initdb.d/seed.sql:ro
      - pg-dynamic-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inventory"]
      interval: 5s
      timeout: 5s
      retries: 30

  heartbeat:
    image: postgres:16
    container_name: cdcpgdyn-heartbeat
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      PGPASSWORD: postgrespw
    entrypoint: >
      sh -c "while true; do
      psql -h postgres -U postgres -d inventory -q
      -c 'UPDATE public.cdc_heartbeat SET beat = now() WHERE id = 1;'
      || true; sleep 10; done"

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: cdcpgdyn-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports: ["9022:9000", "9023:9001"]
    volumes: [minio-pgdynamic-data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 30

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: cdcpgdyn-minio-init
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/warehouse &&
      echo 'bucket warehouse ready'"
    restart: "no"

  iceberg-rest:
    image: apache/iceberg-rest-fixture:1.10.1
    container_name: cdcpgdyn-iceberg-rest
    restart: unless-stopped
    depends_on:
      minio-init: {condition: service_completed_successfully}
    environment:
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: eu-central-1
    ports: ["8200:8181"]

  rest-init:
    image: curlimages/curl:8.7.1
    container_name: cdcpgdyn-rest-init
    depends_on:
      iceberg-rest: {condition: service_started}
    entrypoint: >
      sh -c "until curl -s -o /dev/null -w '%{http_code}' -X POST
      -H 'Content-Type: application/json'
      -d '{\"namespace\":[\"lakehouse\"]}'
      http://iceberg-rest:8181/v1/namespaces | grep -qE '200|409';
      do sleep 2; done; echo namespace ready"

  jobmanager:
    image: flink:2.3.0-java17
    container_name: cdcpgdyn-jobmanager
    command: standalone-job --job-classname com.example.cdc.CdcToIcebergJob
    depends_on:
      postgres: {condition: service_healthy}
      iceberg-rest: {condition: service_started}
      rest-init: {condition: service_completed_successfully}
    ports: ["8099:8081"]
    environment:
      - AWS_REGION=eu-central-1
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        rest.address: 0.0.0.0
        rest.bind-address: 0.0.0.0
        execution.checkpointing.interval: 10s
        state.backend.type: rocksdb
        taskmanager.numberOfTaskSlots: 2
        parallelism.default: 1
    volumes:
      - ./app/target/cdc-to-iceberg-1.0.jar:/opt/flink/usrlib/cdc-to-iceberg-1.0.jar:ro
      - ./docker/application_properties_pg_dynamic.json:/etc/flink/application_properties.json:ro

  taskmanager:
    image: flink:2.3.0-java17
    container_name: cdcpgdyn-taskmanager
    command: taskmanager
    restart: unless-stopped
    depends_on:
      jobmanager: {condition: service_started}
    environment:
      - AWS_REGION=eu-central-1
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2
        taskmanager.memory.process.size: 2560m
        state.backend.type: rocksdb
        parallelism.default: 1
    volumes:
      - ./app/target/cdc-to-iceberg-1.0.jar:/opt/flink/usrlib/cdc-to-iceberg-1.0.jar:ro
      - ./docker/application_properties_pg_dynamic.json:/etc/flink/application_properties.json:ro

volumes:
  pg-dynamic-data:
  minio-pgdynamic-data:
