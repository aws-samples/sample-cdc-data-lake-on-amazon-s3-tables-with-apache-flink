# Application-mode local reproduction of the MSF submission path for the
# DYNAMIC (whole-schema) job. Unlike docker-compose.yml (session mode, SQL
# client, connector jars baked into the image), this runs the SAME fat jar MSF
# runs, in application mode:
#
#   jobmanager: standalone-job --job-classname com.example.cdc.CdcToIcebergJob
#   taskmanager: taskmanager
#   jar in /opt/flink/usrlib/, properties in /etc/flink/application_properties.json
#
# The Flink image is the stock flink:2.3.0-java17 with NO connectors in
# /opt/flink/lib -- exactly like MSF, which provides only the Flink runtime and
# expects the app fat jar to carry the connectors. This is the most faithful
# local reproduction of the MSF launch.
name: zero-etl-cdc-dyn

services:
  mysql:
    image: mysql:8.4.11
    container_name: cdcdyn-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: inventory
      MYSQL_USER: cdc
      MYSQL_PASSWORD: cdcpw
    command:
      - --server-id=223344
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
    ports: ["3307:3306"]
    volumes:
      - ./docker/seed_dynamic.sql:/docker-entrypoint-initdb.d/seed.sql:ro
      - mysql-dyn-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-prootpw"]
      interval: 5s
      timeout: 5s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: cdcdyn-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports: ["9002:9000", "9003:9001"]
    volumes: [minio-dyn-data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 30

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: cdcdyn-minio-init
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/warehouse &&
      echo 'bucket warehouse ready'"
    restart: "no"

  iceberg-rest:
    image: apache/iceberg-rest-fixture:1.10.1
    container_name: cdcdyn-iceberg-rest
    restart: unless-stopped
    depends_on:
      minio-init: {condition: service_completed_successfully}
    environment:
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: eu-central-1
    ports: ["8185:8181"]

  # ---- Application-mode Flink (mirrors MSF: only the runtime, jar in usrlib) --
  jobmanager:
    image: flink:2.3.0-java17
    container_name: cdcdyn-jobmanager
    command: standalone-job --job-classname com.example.cdc.CdcToIcebergJob
    depends_on:
      mysql: {condition: service_healthy}
      iceberg-rest: {condition: service_started}
    ports: ["8083:8081"]
    environment:
      - AWS_REGION=eu-central-1
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        rest.address: 0.0.0.0
        rest.bind-address: 0.0.0.0
        execution.checkpointing.interval: 10s
        state.backend.type: rocksdb
        taskmanager.numberOfTaskSlots: 2
        parallelism.default: 1
    volumes:
      - ./app/target/cdc-to-iceberg-1.0.jar:/opt/flink/usrlib/cdc-to-iceberg-1.0.jar:ro
      - ./docker/application_properties_dynamic.json:/etc/flink/application_properties.json:ro

  taskmanager:
    image: flink:2.3.0-java17
    container_name: cdcdyn-taskmanager
    command: taskmanager
    depends_on:
      jobmanager: {condition: service_started}
    environment:
      - AWS_REGION=eu-central-1
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2
        taskmanager.memory.process.size: 2560m
        state.backend.type: rocksdb
        parallelism.default: 1
    volumes:
      - ./app/target/cdc-to-iceberg-1.0.jar:/opt/flink/usrlib/cdc-to-iceberg-1.0.jar:ro
      - ./docker/application_properties_dynamic.json:/etc/flink/application_properties.json:ro

volumes:
  mysql-dyn-data:
  minio-dyn-data:
